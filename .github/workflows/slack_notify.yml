name: Slack Notifications
on:
  check_suite:
    types: [completed]

permissions:
  contents: read
  checks: read
  id-token: write

jobs:
  slack-notifications:
    if: >-
      github.event.check_suite.conclusion == 'failure' &&
      (
        contains(fromJSON('["main", "master"]'), github.event.check_suite.head_branch) ||
        startsWith(github.event.check_suite.head_branch, 'dogfood-') ||
        startsWith(github.event.check_suite.head_branch, 'branch-')
      )
    runs-on: sonar-xs
    env:
      SLACK_CHANNEL: squad-jvm-notifs
    steps:
      - name: Slack token
        id: secrets
        uses: SonarSource/vault-action-wrapper@d6d745ffdbc82b040df839b903bc33b5592cd6b0 # 3.0.2
        with:
          secrets: |
            development/kv/data/slack token | slack_token;

      - name: Failed check runs
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SUITE_ID: ${{ github.event.check_suite.id }}
          HEAD_BRANCH: ${{ github.event.check_suite.head_branch }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/check-suites/${CHECK_SUITE_ID}/check-runs" \
            --jq '.check_runs[] | select(.conclusion == "failure") | {app: .app.name, name: .name, url: (.details_url // .html_url)}' \
            | jq -s '.' > "$RUNNER_TEMP/failed.json"
          count="$(jq 'length' "$RUNNER_TEMP/failed.json")"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$HEAD_BRANCH" \
            --arg sha "$HEAD_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --slurpfile runs "$RUNNER_TEMP/failed.json" \
            '{channel: $channel, text: (["Failed checks in *\($repo)*", "Branch: *\($branch)*", "Commit: `\($sha)`", "Actor: `\($actor)`", ""] + [$runs[0][] | "• *\(.app)* — <\(.url)|\(.name)>"] | join("\n"))}' \
            > "$RUNNER_TEMP/payload.json"
          echo "payload=$RUNNER_TEMP/payload.json" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: steps.failed.outputs.count != '0'
        uses: step-security/slack-github-action@fd40160713f6a8cec8aceb5c1e3c0a1e42960eb2 # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ fromJSON(steps.secrets.outputs.vault).slack_token }}
          payload-file-path: ${{ steps.failed.outputs.payload }}
          errors: true
