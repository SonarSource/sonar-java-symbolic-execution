name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-5" # Run Mon-Fri at 1:30 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  USE_DEVELOCITY: true
  DEVELOCITY_URL: https://develocity-public.sonar.build/

jobs:
  build:
    name: Build
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
      contents: write
    outputs:
      build-number: ${{ steps.build-step.outputs.BUILD_NUMBER }}
      deployed: ${{ steps.build-step.outputs.deployed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
      - uses: SonarSource/ci-github-actions/build-maven@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        id: build-step
        with:
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          use-develocity: ${{ env.USE_DEVELOCITY }}
          develocity-url: ${{ env.DEVELOCITY_URL }}

  qa:
    needs: [build]
    if: ${{ needs.build.outputs.deployed }}
    runs-on: github-ubuntu-latest-l
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        item:
          - { name: "with Latest SonarJava Plugin", profile: "without-sonarqube-project" }
          - { name: "for SonarQube Project Only", profile: "only-sonarqube-project" }
    name: "QA Tests ${{ matrix.item.name }}"
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
      - name: Get GitHub Token for QA Licenses
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;
      - name: Configure Maven
        id: configure-maven
        uses: SonarSource/ci-github-actions/config-maven@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
        with:
          artifactory-reader-role: private-reader
          use-develocity: ${{ env.USE_DEVELOCITY }}
          develocity-url: ${{ env.DEVELOCITY_URL }}
      - name: Run QA Tests
        working-directory: its/ruling
        env:
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
          MAVEN_OPTS: "-Xmx3g"
        run: |
          mvn package --batch-mode \
            "-Pit-ruling,${{ matrix.item.profile }}" \
            "-Dsonar.runtimeVersion=LATEST_RELEASE" \
            "-Dmaven.test.redirectTestOutputToFile=false" \
            -B -e -V \
            "-Dparallel=methods" \
            "-DuseUnlimitedThreads=true"
      - name: Upload ruling artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruling-actual-${{ matrix.item.profile }}
          path: its/ruling/target/actual/**/*

  promote:
    name: Promote
    if: ${{ needs.build.outputs.deployed }}
    needs:
      - build
      - qa
    runs-on: github-ubuntu-latest-s
    permissions:
      id-token: write
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - name: Promote artifacts
        uses: SonarSource/ci-github-actions/promote@d41706a4180f70b6c0d0479795309a6c99726022 # 2.0.0
